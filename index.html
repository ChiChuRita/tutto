<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The paper's own colour, so the browser's overscroll and the phone's
         status bar are the page rather than white. -->
    <meta name="theme-color" content="#f6f3ec" />
    <!-- The app's own mark, so the tab is not the browser's blank page icon,
         and so the app stops requesting a favicon.ico that was never there. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>Tutto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
