<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The app's mark: one box on the slip, marked.

    Drawn here, like every other mark in this repo, and traced from nothing. It is
    the app's whole gesture at 32px — a ruled box with a die in it, reversed out,
    which is what a Player does six times a Turn. At favicon size the pips are the
    only thing that survives, so the die shows three: the fewest that still reads
    as a die rather than as a filled square (the same call `Mark.tsx` made).
  -->
  <rect width="32" height="32" fill="#e9ebe9"/>
  <rect x="3.5" y="3.5" width="25" height="25" fill="none" stroke="#a3b0b4" stroke-width="1"/>
  <rect x="6" y="6" width="20" height="20" fill="#14181a"/>
  <g fill="#e9ebe9">
    <circle cx="11" cy="11" r="2.1"/>
    <circle cx="16" cy="16" r="2.1"/>
    <circle cx="21" cy="21" r="2.1"/>
  </g>
</svg>
