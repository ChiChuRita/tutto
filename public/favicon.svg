<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The app's mark: a die on the paper.

    Drawn here, like every other mark in this repo. It is the app's whole gesture
    at 32px, and it is printed in the ground's own three values: the paper
    (`--color-base`), the rule (`--color-edge`) and the one ink
    (`--color-ink`). At favicon size the pips are the only thing that survives,
    so the die shows three: the fewest that still reads as a die rather than as a
    filled square, which is the same call `Mark.tsx` made.

    Literal hex and not the CSS variables, because a favicon is fetched on its
    own and never sees the stylesheet. So it is a copy, and the only one: if the
    ground's values move, this file moves with them.
  -->
  <rect width="32" height="32" fill="#f6f3ec"/>
  <rect x="3.5" y="3.5" width="25" height="25" fill="none" stroke="#d9d3c6" stroke-width="1"/>
  <rect x="6" y="6" width="20" height="20" fill="#1c1b19"/>
  <g fill="#f6f3ec">
    <circle cx="11" cy="11" r="2.1"/>
    <circle cx="16" cy="16" r="2.1"/>
    <circle cx="21" cy="21" r="2.1"/>
  </g>
</svg>
